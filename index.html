<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0A0C0E;color:#fff;font:400 16px/1.5 'Golos Text',system-ui,sans-serif;
display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:#12161A;border:1px solid #232A31;border-radius:20px;padding:40px 34px 32px;text-align:center}
.mark{font-family:'Manrope',sans-serif;font-weight:300;font-size:22px;letter-spacing:.22em;margin-bottom:26px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7C8894;margin-bottom:10px}
h1{font-family:'Manrope',sans-serif;font-weight:300;font-size:25px;letter-spacing:-.02em;line-height:1.2;margin-bottom:24px}
input{width:100%;background:#0A0C0E;border:1px solid #2A323A;border-radius:11px;padding:14px 16px;color:#fff;
font:400 16px 'Golos Text',sans-serif;text-align:center;letter-spacing:.06em}
input:focus{outline:none;border-color:#2B6FA4}
button{width:100%;margin-top:12px;background:#2B6FA4;border:0;border-radius:11px;padding:14px;color:#fff;
font:500 15px 'Golos Text',sans-serif;cursor:pointer;transition:background .15s}
button:hover:not(:disabled){background:#3582BE}button:disabled{opacity:.55;cursor:default}
.msg{font-size:13px;margin-top:14px;min-height:19px;color:#7C8894}.msg.err{color:#E2726E}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.note{font-size:12px;color:#5D6974;margin-top:22px;line-height:1.5}
</style></head><body>

<script>
(function(){
  var ITER=200000, KEY='iceberg_retro_k';
  var f=document.getElementById('f'), pw=document.getElementById('pw'), go=document.getElementById('go'),
      m=document.getElementById('m'), card=document.getElementById('card');
  if(!window.crypto||!crypto.subtle){m.className='msg err';m.textContent='Браузер не поддерживает расшифровку. Откройте в Safari, Chrome или Firefox.';go.disabled=true;return}
  var raw=Uint8Array.from(atob(document.getElementById('p').textContent.trim()),function(c){return c.charCodeAt(0)});
  var salt=raw.subarray(0,16), iv=raw.subarray(16,28), tag=raw.subarray(28,44), ct=raw.subarray(44);
  var data=new Uint8Array(ct.length+tag.length); data.set(ct); data.set(tag,ct.length);
  function open_(pass){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
      .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])})
      .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data)})
      .then(function(buf){var html=new TextDecoder('utf-8').decode(buf);
        try{sessionStorage.setItem(KEY,pass)}catch(e){}
        document.open();document.write(html);document.close()});
  }
  f.addEventListener('submit',function(e){e.preventDefault();
    var pass=pw.value.trim().toLowerCase(); if(!pass){pw.focus();return}
    go.disabled=true;m.className='msg';m.textContent='Расшифровываем…';
    setTimeout(function(){open_(pass)['catch'](function(){
      go.disabled=false;m.className='msg err';m.textContent='Неверный пароль';
      card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');pw.select()})},30)});
  try{var s=sessionStorage.getItem(KEY);
    if(s){m.textContent='Открываем…';go.disabled=true;
      open_(s)['catch'](function(){sessionStorage.removeItem(KEY);go.disabled=false;m.textContent=''})}}catch(e){}
})();
</script></body></html>
